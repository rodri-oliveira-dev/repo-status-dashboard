name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Lighthouse CI
        run: npm install --no-save --package-lock=false @lhci/cli@0.15.1

      - name: Build site
        run: npm run build

      - name: Start local site
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory dist/repo-control-center/browser             > /tmp/repo-control-center-http.log 2>&1 &
          echo $! > /tmp/repo-control-center-http.pid

          for _ in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/repo-control-center-http.log
          exit 1

      - name: Collect Lighthouse reports
        run: npx --no-install lhci collect --config=lighthouserc.cjs

      - name: Summarize Lighthouse results
        run: node .github/scripts/summarize-lighthouse.mjs

      - name: Assert Lighthouse budgets
        run: npx --no-install lhci assert --config=lighthouserc.cjs

      - name: Publish Lighthouse report on PR
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          report=".lighthouseci/pr-comment.md"
          if [[ ! -f "$report" ]]; then
            echo "Lighthouse PR report was not generated."
            exit 0
          fi

          comment_id="$(
            gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments"               --jq '.[] | select(.body | startswith("<!-- lighthouse-ci-report -->")) | .id'               | head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${comment_id}"               -F "body=@${report}" > /dev/null
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments"               -F "body=@${report}" > /dev/null
          fi

      - name: Stop local site
        if: always()
        run: |
          if [[ -f /tmp/repo-control-center-http.pid ]]; then
            kill "$(cat /tmp/repo-control-center-http.pid)" 2>/dev/null || true
          fi
