name: OWASP ZAP Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * 1'
  workflow_run:
    workflows: ['Deploy GitHub Pages']
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: owasp-zap-pages
  cancel-in-progress: true

jobs:
  baseline:
    name: Passive security scan
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event != 'schedule'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Wait for published site
        shell: bash
        run: |
          target="https://rodri-oliveira-dev.github.io/repo-status-dashboard/"
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --location --max-time 15 "$target" > /dev/null; then
              echo "Published site is available."
              exit 0
            fi
            echo "Site not available yet (attempt ${attempt}/18)."
            sleep 10
          done

          echo "Published site did not become available in the expected window."
          exit 1

      - name: Run OWASP ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          token: ${{ github.token }}
          target: https://rodri-oliveira-dev.github.io/repo-status-dashboard/
          rules_file_name: .zap/rules.tsv
          cmd_options: '-c .zap/rules.tsv --hook=/zap/wrk/.zap/hooks.py -m 1 -l WARN'
          fail_action: false
          allow_issue_writing: false
          issue_title: OWASP ZAP Baseline Report
          artifact_name: owasp-zap-baseline

      - name: Build actionable ZAP report
        id: zap_report
        if: always()
        run: node scripts/process-zap-report.mjs --report report_json.json --output zap-actionable.md
        env:
          ZAP_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Manage actionable ZAP issue
        if: always() && steps.zap_report.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_FINDINGS: ${{ steps.zap_report.outputs.has_findings }}
        run: |
          title="OWASP ZAP Baseline Report"
          issue_number="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "OWASP ZAP Baseline Report") | .number' | head -n 1)"

          if [[ "$HAS_FINDINGS" == "true" ]]; then
            if [[ -n "$issue_number" ]]; then
              gh issue edit "$issue_number" --body-file zap-actionable.md --add-assignee rodri-oliveira-dev
            else
              gh issue create --title "$title" --body-file zap-actionable.md --assignee rodri-oliveira-dev
            fi
          elif [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" --comment "No actionable OWASP ZAP findings remain for Repo Control Center."
          fi

      - name: Write security summary
        if: always()
        run: |
          {
            echo "# OWASP ZAP baseline"
            echo
            echo "- **Target:** https://rodri-oliveira-dev.github.io/repo-status-dashboard/"
            echo "- **Scope:** /repo-status-dashboard/** only"
            echo "- **Mode:** passive baseline scan"
            echo "- **Deployment gate:** report-only"
            echo "- **GitHub Pages managed headers/cache:** classified as INFO"
            echo "- **CSP:** application-controlled findings remain actionable"
            echo "- **Actionable findings:** post-processed from the raw ZAP JSON and maintained in the OWASP ZAP Baseline Report issue"
          } >> "$GITHUB_STEP_SUMMARY"
